# OpenOCD for the RP2350B (U6) through a Raspberry Pi Debug Probe on J6.

adapter driver cmsis-dap
adapter speed 5000

source [find target/rp2350.cfg]

# The board's own RUN line is not broken out to the probe, so resets go
# over SWD. srst_nogate keeps the debug domain alive across one.
reset_config srst_only srst_nogate
